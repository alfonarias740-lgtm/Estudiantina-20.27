<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ESTUDIANTINA 2027</title>
<style>
:root{--bg:#0b0b1a;--card:#171733;--tx:#f4f4ff;--mu:#9a9ac0;--ac:#ff3d81;--ac2:#ffd23f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#3a1a6e55,transparent),var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;position:sticky;top:env(safe-area-inset-top,0px);background:#0b0b1aee;backdrop-filter:blur(8px);z-index:5}
h1{margin:0;font-size:1.3rem;letter-spacing:2px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
main{max-width:1000px;margin:0 auto;padding:14px 16px 60px}h2{margin:26px 0 10px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;animation:in .4s both}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.cc{border-radius:16px;padding:16px;cursor:pointer;color:#fff;font-weight:700;transition:transform .2s;border:0;text-align:left}.cc:hover{transform:translateY(-4px) scale(1.02)}
button,input,select,textarea{font:inherit;color:var(--tx);background:#232350;border:1px solid #3a3a70;border-radius:10px;padding:9px 12px;max-width:100%}
button{cursor:pointer;background:var(--ac);border:0;font-weight:700}button.g{background:#2c2c5c}button.x{background:#5a1830;padding:4px 9px}
input,select,textarea{width:100%;margin:4px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.mu{color:var(--mu);font-size:.85rem}.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.tabs button{white-space:nowrap}
.rank{position:relative}.rk{position:absolute;left:0;right:0;height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:14px;background:var(--card);transition:top .7s cubic-bezier(.3,1.4,.5,1);border-left:8px solid var(--c)}
.rk b.p{font-size:1.4rem;width:34px}.rk .n{flex:1;font-weight:700}.rk .pt{font-size:1.3rem;font-weight:800}
.rk.t1{background:linear-gradient(90deg,#ffd23f55,var(--card))}.rk.t2{background:linear-gradient(90deg,#c0c0d055,var(--card))}.rk.t3{background:linear-gradient(90deg,#cd7f3255,var(--card))}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.75rem;background:#2c2c5c}.pos{color:#5dffa0}.neg{color:#ff6b8b}
.tv{position:fixed;inset:0;background:var(--bg);z-index:20;padding:3vh 4vw;overflow:auto}.tv .rk{height:9vh;font-size:3.2vh}.tv .rk .pt,.tv .rk b.p{font-size:4vh}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px;border-bottom:1px solid #2c2c5c;text-align:left}.ov{overflow-x:auto}
.cd{display:flex;gap:10px}.cd div{background:var(--card);padding:10px 14px;border-radius:12px;text-align:center;font-size:1.6rem;font-weight:800}.cd small{display:block;font-size:.65rem;color:var(--mu)}
</style></head><body><header><h1 id="ttl">ESTUDIANTINA 2027</h1><div id="nav" class="row" style="flex:0 0 auto"></div></header><main id="app"><p class="mu">Cargando…</p></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let db,cfg=null,ses=null,view="home",tab="Puntos",tvOn=false,ready=false;
const S={pts:[],acts:[],news:[],cal:[],polls:[],votes:[],log:[]};
try{ses=JSON.parse(sessionStorage.getItem("ses")||"null")}catch(e){}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fd=t=>t?new Date(t).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"}):"";
const isC=()=>ses&&ses.role==="coord",course=id=>(cfg.courses||[]).find(c=>c.id===id)||{name:"?",color:"#888"};
const dev=()=>{try{let d=localStorage.getItem("dev");if(!d){d=uid();localStorage.setItem("dev",d)}return d}catch(e){return "x"}};
const api=async(p,b)=>{const r=await fetch("/api/"+p,{method:b?"POST":"GET",headers:{"content-type":"application/json",authorization:"Bearer "+(ses&&ses.token||"")},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("Error "+r.status));return j};
const add=async(k,o)=>{await api("add",{kind:k,data:o});await load(true)};
const del=async(k,id)=>{if(!confirm("¿Eliminar?"))return;await api("delete",{id});await load(true)};
const log=async()=>{};
function totals(){const m={};(cfg.courses||[]).forEach(c=>m[c.id]={c,pts:0,last:0,lt:0});
 S.pts.forEach(p=>{const r=m[p.course];if(!r)return;r.pts+=+p.delta;if(p.ts>=r.lt){r.lt=p.ts;r.last=+p.delta}});
 return Object.values(m).sort((a,b)=>b.pts-a.pts)}
function rankHTML(){const t=totals();return`<div class="rank" style="height:${t.length*62}px">${t.map((r,i)=>`<div class="rk ${i<3?"t"+(i+1):""}" style="--c:${r.c.color};top:${i*62}px"><b class="p">${i<3?["🥇","🥈","🥉"][i]:i+1}</b><span class="n">${esc(r.c.name)}<br><span class="mu">${i?"−"+(t[i-1].pts-r.pts)+" vs anterior":"Líder"} · último <span class="${r.last<0?"neg":"pos"}">${r.last>0?"+":""}${r.last}</span></span></span><span class="pt">${r.pts}</span></div>`).join("")}</div>`}
function login(role,id,name){ses={role,id,name};try{sessionStorage.setItem("ses",JSON.stringify(ses))}catch(e){}view=role==="coord"?"admin":role==="course"?"course":"sexto";render()}
function nav(){$("#nav").innerHTML=(cfg?`<button class="g" onclick="view='home';render()">Inicio</button><button class="g" onclick="tvOn=true;render()">📺 TV</button>`:"")+(ses?`<button class="g" onclick="view='${ses.role==="coord"?"admin":ses.role==="course"?"course":"sexto"}';render()">${esc(ses.name)}</button><button class="x" onclick="ses=null;try{sessionStorage.removeItem('ses')}catch(e){};view='home';render()">Salir</button>`:"")}
function forMe(n){return !n.to||!n.to.length||isC()||(ses&&ses.role==="course"&&n.to.includes(ses.id))||(ses&&ses.role==="sexto")}
function newsHTML(){const l=S.news.filter(forMe).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.ts-a.ts);return l.map(n=>`<div class="card" ${n.pin?'style="border:1px solid var(--ac2)"':""}>${n.pin?"📌 ":""}<b>${esc(n.title)}</b><p>${esc(n.body)}</p><span class="mu">${fd(n.ts)} · ${n.to&&n.to.length?n.to.map(i=>esc(course(i).name)).join(", "):"Todos"}</span>${isC()?` <button class="x" onclick="del('news','${n.id}')">✕</button>`:""}</div>`).join("")||'<p class="mu">Sin noticias.</p>'}
function actsHTML(f){return S.acts.filter(f||(()=>true)).sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(a=>`<div class="card"><b>${esc(a.name)}</b> <span class="tag">${esc(a.state)}</span>${a.flash?' <span class="tag">⚡ desafío</span>':""}<p>${esc(a.desc)}</p><span class="mu">${fd(a.date)} · ${esc(a.place)} · Máx ${esc(a.max)} pts</span>${a.rules?`<div class="mu">Reglas: ${esc(a.rules)}</div>`:""}${isC()?` <button class="x" onclick="del('acts','${a.id}')">✕</button>`:""}</div>`).join("")||'<p class="mu">Nada por ahora.</p>'}
function calHTML(){return S.cal.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="card">📅 <b>${esc(e.title)}</b> <span class="tag">${esc(e.type)}</span><br><span class="mu">${fd(e.date)}</span>${isC()?` <button class="x" onclick="del('cal','${e.id}')">✕</button>`:""}</div>`).join("")||'<p class="mu">Sin eventos.</p>'}
function histHTML(f){return`<div class="ov"><table><tr><th>Fecha</th><th>Curso</th><th>Pts</th><th>Motivo</th><th>Por</th></tr>${S.pts.filter(f||(()=>true)).sort((a,b)=>b.ts-a.ts).map(p=>`<tr><td>${fd(p.ts)}</td><td>${esc(course(p.course).name)}</td><td class="${p.delta<0?"neg":"pos"}">${p.delta>0?"+":""}${p.delta}</td><td>${esc(p.reason)}${p.obs?" · "+esc(p.obs):""}</td><td>${esc(p.by)}</td></tr>`).join("")}</table></div>`}
function pollsHTML(){return S.polls.map(p=>{const open=Date.now()>=new Date(p.from)&&Date.now()<=new Date(p.to);return`<div class="card"><b>${esc(p.q)}</b> <span class="tag">${open?"abierta":"cerrada"}</span>${p.anon?' <span class="tag">anónima</span>':""}${p.opts.map((o,i)=>`<div class="row" style="align-items:center;margin:4px 0"><span style="flex:3">${esc(o)}${p.counts?` <span class="mu">(${p.counts[i]})</span>`:""}</span>${open&&ses&&!p.mine?`<button onclick="vote('${p.id}',${i})">Votar</button>`:""}</div>`).join("")}${p.mine?'<span class="mu">✔ Ya votaste</span>':""}${isC()?` <button class="x" onclick="del('polls','${p.id}')">✕</button>`:""}</div>`}).join("")||'<p class="mu">Sin encuestas.</p>'}
async function vote(poll,opt){try{await api("vote",{poll,opt,device:dev()});await load(true)}catch(e){alert(e.message)}}
function cdHTML(){const t=cfg.start?new Date(cfg.start)-Date.now():0;if(t<=0)return"";const d=Math.floor(t/864e5),h=Math.floor(t/36e5)%24,m=Math.floor(t/6e4)%60;return`<h2>⏳ Faltan</h2><div class="cd"><div>${d}<small>días</small></div><div>${h}<small>horas</small></div><div>${m}<small>min</small></div></div>`}
function home(){const a=$("#app");a.innerHTML=`<p class="mu">${esc(cfg.school||"")} · ${esc(cfg.start||"")} → ${esc(cfg.end||"")}</p>${cdHTML()}<h2>🏆 Ranking general</h2>${rankHTML()}<h2>Cursos</h2><div class="grid">${(cfg.courses||[]).map(c=>`<button class="cc" style="background:${c.color}" onclick="loginForm('course','${c.id}')">${esc(c.name)}</button>`).join("")}<button class="cc" style="background:#444" onclick="loginForm('sexto')">Sexto año</button><button class="cc" style="background:#222;border:1px solid var(--ac)" onclick="loginForm('coord')">🔑 Coordinadores</button></div><div id="lf"></div><h2>📢 Noticias</h2>${newsHTML()}<h2>🎯 Actividades y desafíos</h2>${actsHTML(x=>x.state!=="Finalizada")}<h2>📅 Calendario</h2>${calHTML()}`}
function loginForm(role,id){const co=cfg.coordinators||[];$("#lf").innerHTML=`<div class="card"><b>Ingreso ${role==="course"?"– "+esc(course(id).name):role==="sexto"?"– Sexto":"– Coordinadores"}</b>${role==="coord"?`<select id="lu">${co.map((c,i)=>`<option value="${i}">${esc(c.name)}</option>`).join("")}</select>`:""}<input id="lp" type="password" placeholder="Contraseña"><button onclick="doLogin('${role}','${id||""}')">Entrar</button><p class="mu" id="le"></p></div>`;$("#lf").scrollIntoView({behavior:"smooth"})}
async function doLogin(role,id){try{const j=await api("login",{role,id:role==="coord"?$("#lu").value:id,password:$("#lp").value});ses={role:j.role,id:j.id,name:j.name,token:j.token};try{sessionStorage.setItem("ses",JSON.stringify(ses))}catch(e){}view=role==="coord"?"admin":role==="course"?"course":"sexto";await load(true)}catch(e){$("#le").textContent=e.message}}
function courseView(){const c=course(ses.id),t=totals(),pos=t.findIndex(r=>r.c.id===c.id)+1,me=t[pos-1];$("#app").innerHTML=`<div class="card" style="border-left:10px solid ${c.color}"><h2 style="margin:0">${esc(c.name)}</h2>Posición <b>${pos}º</b> · <b>${me.pts}</b> puntos${c.members?" · "+esc(c.members)+" integrantes":""}</div><h2>Ranking</h2>${rankHTML()}<h2>Mis puntos</h2>${histHTML(p=>p.course===c.id)}<h2>Noticias</h2>${newsHTML()}<h2>Próximas actividades</h2>${actsHTML(a=>a.state!=="Finalizada"&&(!a.courses||!a.courses.length||a.courses.includes(c.id)))}<h2>Calendario</h2>${calHTML()}<h2>Encuestas</h2>${pollsHTML()}`}
function sextoView(){$("#app").innerHTML=`<h2>Espacio de Sexto año</h2>${rankHTML()}<h2>Noticias</h2>${newsHTML()}<h2>Actividades</h2>${actsHTML()}<h2>Calendario</h2>${calHTML()}<h2>Encuestas</h2>${pollsHTML()}`}
const opt=a=>a.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
const F={
Puntos:()=>`<div class="card"><div class="row"><select id="f1">${opt(cfg.courses)}</select><input id="f2" type="number" placeholder="Puntos (− resta)"></div><input id="f3" placeholder="Motivo"><select id="f4"><option value="">Actividad (opcional)</option>${S.acts.map(a=>`<option>${esc(a.name)}</option>`).join("")}</select><input id="f5" placeholder="Observaciones"><button onclick="sv('pts')">Registrar</button></div>${histHTML()}`,
Actividades:()=>`<div class="card"><input id="f1" placeholder="Nombre"><textarea id="f2" placeholder="Descripción"></textarea><div class="row"><input id="f3" type="datetime-local"><input id="f4" placeholder="Lugar"><input id="f5" type="number" placeholder="Puntaje máx."></div><textarea id="f6" placeholder="Reglas"></textarea><div class="row"><select id="f7"><option>Próximamente</option><option>Inscripciones abiertas</option><option>En desarrollo</option><option>Finalizada</option></select><select id="f8"><option value="">Actividad</option><option value="1">Desafío sorpresa</option></select></div><select id="f9" multiple>${opt(cfg.courses)}</select><span class="mu">Cursos participantes (ninguno = todos)</span><br><button onclick="sv('acts')">Crear</button></div>${actsHTML()}`,
Noticias:()=>`<div class="card"><input id="f1" placeholder="Título"><textarea id="f2" placeholder="Mensaje"></textarea><select id="f3" multiple>${opt(cfg.courses)}</select><span class="mu">Destinatarios (ninguno = todos)</span><br><label><input id="f4" type="checkbox" style="width:auto"> Destacar</label> <button onclick="sv('news')">Publicar</button></div>${newsHTML()}`,
Calendario:()=>`<div class="card"><input id="f1" placeholder="Evento"><div class="row"><input id="f2" type="datetime-local"><select id="f3"><option>Competencia</option><option>Evento</option><option>Entrega</option><option>Presentación</option><option>Reunión</option><option>Fecha límite</option></select></div><button onclick="sv('cal')">Agregar</button></div>${calHTML()}`,
Encuestas:()=>`<div class="card"><input id="f1" placeholder="Pregunta"><textarea id="f2" placeholder="Una opción por línea"></textarea><div class="row"><input id="f3" type="datetime-local"><input id="f4" type="datetime-local"></div><label><input id="f5" type="checkbox" style="width:auto"> Anónima</label> <button onclick="sv('polls')">Crear</button></div>${pollsHTML()}`,
Historial:()=>`<div class="ov"><table>${S.log.sort((a,b)=>b.ts-a.ts).map(l=>`<tr><td>${fd(l.ts)}</td><td>${esc(l.by)}</td><td>${esc(l.text)}</td></tr>`).join("")}</table></div><button class="g" onclick="exp()">⬇ Exportar resultados CSV</button>`,
Config:()=>`<div class="card"><b>Cursos</b> <span class="mu">nombre,#color,contraseña(opcional=no cambia),integrantes — uno por línea</span><textarea id="f1" rows="6">${cfg.courses.map(c=>[c.name,c.color,"",c.members||""].join(",")).join("\n")}</textarea><b>Coordinadores</b> <span class="mu">nombre,contraseña(opcional) — hasta 10</span><textarea id="f2" rows="6">${cfg.coordinators.map(c=>c.name+",").join("\n")}</textarea><input id="f3" type="password" placeholder="Nueva contraseña de Sexto (opcional)"><div class="row"><input id="f4" value="${esc(cfg.school)}"><input id="f5" type="date" value="${esc(cfg.start)}"><input id="f6" type="date" value="${esc(cfg.end)}"></div><button onclick="saveCfg()">Guardar configuración</button></div>`};
const gv=i=>{const e=$("#f"+i);return e?e.value.trim():""},gm=i=>[...$("#f"+i).selectedOptions].map(o=>o.value);
async function sv(k){try{
 if(k==="pts"){const d=+gv(2);if(!d||!gv(3))return alert("Puntos y motivo obligatorios");await add("pts",{course:gv(1),delta:d,reason:gv(3),act:gv(4),obs:gv(5),by:ses.name});await log((d>0?"Se agregaron ":"Se descontaron ")+Math.abs(d)+" puntos a "+course(gv(1)).name+": "+gv(3))}
 if(k==="acts"){if(!gv(1))return;await add("acts",{name:gv(1),desc:gv(2),date:gv(3),place:gv(4),max:gv(5),rules:gv(6),state:gv(7),flash:!!gv(8),courses:gm(9),by:ses.name});await log("Se publicó actividad: "+gv(1))}
 if(k==="news"){if(!gv(1))return;await add("news",{title:gv(1),body:gv(2),to:gm(3),pin:$("#f4").checked,by:ses.name});await log("Se publicó noticia: "+gv(1))}
 if(k==="cal"){if(!gv(1)||!gv(2))return;await add("cal",{title:gv(1),date:gv(2),type:gv(3)});await log("Evento de calendario: "+gv(1))}
 if(k==="polls"){const o=gv(2).split("\n").map(s=>s.trim()).filter(Boolean);if(!gv(1)||o.length<2||!gv(3)||!gv(4))return alert("Completa pregunta, 2+ opciones y fechas");await add("polls",{q:gv(1),opts:o,from:gv(3),to:gv(4),anon:$("#f5").checked});await log("Se creó encuesta: "+gv(1))}
 }catch(e){alert("Error: "+(e.message||e))}}
const L=t=>t.split("\n").filter(x=>x.trim()).map(l=>l.split(",").map(x=>x.trim()));
const cfgBody=()=>({school:gv(4),start:gv(5),end:gv(6),sextoPassword:gv(3),courses:L(gv(1)).map(([name,color,password,members])=>({name,color,password,members})),coordinators:L(gv(2)).map(([name,password])=>({name,password}))});
async function saveCfg(){try{await api("config",cfgBody());await load(true);alert("Guardado")}catch(e){alert("Error: "+e.message)}}
function exp(){const t=totals(),csv="Posicion,Curso,Puntos\n"+t.map((r,i)=>`${i+1},"${r.c.name}",${r.pts}`).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="resultados.csv";a.click()}
function admin(){if(!isC()){view="home";return render()}$("#app").innerHTML=`<h2>Panel de coordinadores</h2><div class="tabs">${Object.keys(F).map(k=>`<button class="${k===tab?"":"g"}" onclick="tab='${k}';render()">${k}</button>`).join("")}</div>${F[tab]()}<h2>Ranking</h2>${rankHTML()}`}
function setup(){$("#app").innerHTML=`<h2>Configuración inicial</h2><div class="card"><p class="mu">Completa los datos. Todo se puede editar luego desde el panel.</p><input id="f4" placeholder="Nombre del colegio"><div class="row"><input id="f5" type="date"><input id="f6" type="date"></div><b>Cursos</b> <span class="mu">nombre,#color,contraseña,integrantes — uno por línea</span><textarea id="f1" rows="5" placeholder="Curso A,#e63946,clave1,30&#10;Curso B,#2a9d8f,clave2,28"></textarea><b>Coordinadores (10)</b> <span class="mu">nombre,contraseña</span><textarea id="f2" rows="6" placeholder="Nombre,clave"></textarea><input id="f3" type="password" placeholder="Contraseña general de Sexto"><input id="f7" type="password" placeholder="Clave de instalación (SETUP_KEY de Netlify)"><button onclick="first()">Crear plataforma</button></div>`}
async function first(){const b=cfgBody();if(!b.courses.length||!b.coordinators.length||b.courses.some(c=>!c.password)||b.coordinators.some(c=>!c.password)||!b.sextoPassword)return alert("Cada curso y coordinador necesita contraseña, y Sexto también");try{await api("setup",{...b,setupKey:gv(7)});await load(true)}catch(e){alert(e.message)}}
function render(){nav();const a=$("#app");if(!ready)return;
 if(tvOn){a.innerHTML=`<div class="tv"><h1 style="font-size:5vh">🏆 ESTUDIANTINA 2027</h1>${rankHTML()}<button class="g" style="position:fixed;top:10px;right:10px" onclick="tvOn=false;render()">✕</button></div>`;return}
 if(!cfg)return setup();$("#ttl").textContent="ESTUDIANTINA 2027";
 if(view==="admin")return admin();if(view==="course"&&ses)return courseView();if(view==="sexto"&&ses)return sextoView();home()}
async function load(force){try{const j=await api("state?d="+dev());cfg=j.cfg;for(const k of Object.keys(S))S[k]=j[k]||[];ready=true;if(!force&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;render()}catch(e){if(!ready)$("#app").innerHTML='<div class="card">Error de conexión: '+esc(e.message)+'</div>'}}
load();setInterval(()=>load(false),6000);
</script></body></html>
